version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockanal_backend
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      # Flask 配置
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PORT=8888

      # Agent 配置
      - USE_AGENT_SYSTEM=true
      - MAX_QA=${MAX_QA:-20}

      # 数据库配置
      - DATABASE_URL=sqlite:///data/stock_analyzer.db
      - USE_DATABASE=${USE_DATABASE:-False}
      - WIND_DATABASE_URL=sqlite:///data/wind_cache.db

      # Redis 配置
      - REDIS_URL=redis://redis:6379
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-False}

      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=logs/stock_analyzer.log

      # 鉴权配置
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}

      # 网络配置
      - DISABLE_NETWORK=${DISABLE_NETWORK:-0}
      - MOCK_LLM=${MOCK_LLM:-0}

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stockanal_network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8888
    container_name: stockanal_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8888}
      - NEXT_PUBLIC_API_DEFAULT_TIMEOUT_MS=${NEXT_PUBLIC_API_DEFAULT_TIMEOUT_MS:-60000}
      - NEXT_PUBLIC_SSE_HEARTBEAT_TIMEOUT_MS=${NEXT_PUBLIC_SSE_HEARTBEAT_TIMEOUT_MS:-120000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stockanal_network

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: stockanal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stockanal_network

  # Nginx 反向代理（可选，生产环境推荐）
  nginx:
    image: nginx:alpine
    container_name: stockanal_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - production
    networks:
      - stockanal_network

volumes:
  redis_data:
    driver: local

networks:
  stockanal_network:
    driver: bridge

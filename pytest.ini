[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: 单元测试
    integration: 集成测试
    api: HTTP/REST API 测试
    sse: SSE 流式测试
    slow: 慢测试（>5s）
    perf: 性能与长跑
    security: 安全测试
    e2e: 端到端测试
    regression: 回归测试
addopts = -ra --strict-markers --tb=short -p no:randomly
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

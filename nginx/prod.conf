# Input: HTTP/HTTPS 请求
# Output: SSL终结 + 反代 frontend:3000 / backend:8888
# Pos: K2 生产级Nginx配置 [NEW-FILE:#20260415-47]
# 一旦我被修改, 请同步更新 nginx/README.md

# ─────────────────────────────────────────────────────────────
# K2 生产级Nginx (2026-04-15 14:32 +08:00)
# - 80 → 443 强制跳转 (SSL cert就绪后启用)
# - SSE/WebSocket 透传 (proxy_buffering off)
# - /api/ → backend:8888 ; / → frontend:3000
# ─────────────────────────────────────────────────────────────

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

upstream backend {
    server backend:8888;
    keepalive 32;
}

# HTTP → HTTPS 跳转 (Comdr放入cert后取消注释 return 301)
server {
    listen 80;
    server_name _;

    # ACME challenge (Let's Encrypt certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书就绪后启用下一行, 注释掉后面的 location 块
    # return 301 https://$host$request_uri;

    # ─── 无SSL模式 (开发/未配证书时生效) ───
    client_max_body_size 50M;

    location = /api-docs {
        return 302 /api/docs/;
    }

    location = /api-docs/ {
        return 302 /api/docs/;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE/长连接透传
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/rss+xml;
}


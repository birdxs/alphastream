# CI 主工作流 — PR / push 至 main 触发
# Input  : GitHub push/pull_request 事件 (branch=main)
# Output : 后端语法/导入检查 / tsc 检查 / next build 产物 / docker 构建状态
# Pos    : .github/workflows/ci.yml — M2 自动化验证关口
# [NEW-FILE:#20260415-52]
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend syntax + import smoke (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend sources
        run: python -m compileall -q app run.py
      - name: Import Flask application
        env:
          AUTH_REQUIRED: "false"
          DISABLE_NETWORK: "1"
          MOCK_LLM: "1"
        run: python -c "from app.web.web_server import app; assert app is not None"

  frontend-build:
    name: Frontend tsc + next build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js build
        run: npx next build

  docker-build:
    name: Docker Compose build (push only)
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build prod stack
        run: docker compose -f docker-compose.prod.yml build

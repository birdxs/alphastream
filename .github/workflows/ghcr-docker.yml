name: Build & Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (e.g. v1.0.0)"
        required: true
        type: string

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  # ──────────────────────────────────────────────
  # Backend image: stockanal-backend
  # ──────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/stockanal-backend:${{ inputs.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/stockanal-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stockanal:backend-${{ inputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/stockanal:backend-latest

  # ──────────────────────────────────────────────
  # Frontend image: stockanal-frontend
  # ──────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/stockanal-frontend:${{ inputs.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/stockanal-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stockanal:frontend-${{ inputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/stockanal:frontend-latest

  # ──────────────────────────────────────────────
  # Update Docker Hub repo descriptions from README
  # ──────────────────────────────────────────────
  update-dockerhub-description:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update DockerHub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/stockanal
          short-description: "AI-Native 智能金融分析平台"
          readme-filepath: ./README.md

# Adapter 周冒烟 — 每周一 02:00 UTC (10:00 +08:00) 执行
# Input  : 定时触发 / 手动 workflow_dispatch
# Output : smoke_output.log 上传为 artifact (14天保留)
# Pos    : .github/workflows/adapter-smoke-weekly.yml — M2 数据源健康巡检
# [NEW-FILE:#20260415-53]
name: Adapter Smoke (Weekly)

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    name: Run scripts/smoke_adapters.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run smoke
        run: python scripts/smoke_adapters.py > smoke_output.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ github.run_id }}
          path: smoke_output.log
          retention-days: 14
